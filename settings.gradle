pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'delivery-system'

include 'eureka-server'
include 'order-service'
include 'payment-service'
include 'review-service'
